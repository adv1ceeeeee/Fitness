name: sportwai
description: Sportify - мобильное приложение для отслеживания тренировок
publish_to: 'none'
version: 1.9.0+24

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  flutter_typeahead: ^5.2.0
  http: ^1.2.2
  table_calendar: ^3.1.0
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  sentry_flutter: ^8.13.2
  shimmer: ^3.0.0
  local_auth: ^2.3.0
  package_info_plus: ^8.1.3
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  google_fonts: ^6.2.1
  in_app_review: ^2.0.10
  window_manager: ^0.4.3
  flutter_svg: ^2.0.10+1
  # firebase_core / firebase_messaging temporarily removed.
  # Re-enable when push notifications are wired up — also restore
  # _initFcm() in main.dart and recreate firebase_options.dart via
  # `flutterfire configure`.
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0066FF"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0066FF"
  adaptive_icon_foreground: "assets/icon/icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/emojis/
    - assets/body/
